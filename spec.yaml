id: vehicle

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.0rc23"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: ecoscope-workflows-ext-apn
    version: "0.0.34"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    get_template_path.title: Report Template
    get_template_path.properties.var.title: Template Path
    get_template_path.properties.var.description: Path or URL to the .docx template used for the report.
    get_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/APN-vehicle/main/resources/templates/vehicle_report_template.docx"
    get_template_path.properties.var.ecoscope:advanced: true
    patente.properties.var.title: "Patente"

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - id: user_details
    task: get_user_me
    partial:
      client: ${{ workflow.er_client.return }}

  - name: Define Base Maps
    id: base_maps
    task: set_base_maps

  - name: Set Locale
    id: locale
    task: set_locale
    partial:
      locale_str: es_ES

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  # Vehicle patente to report on — drives the filter below
  - name: Patente del Vehículo
    id: patente
    task: set_string_var

  # Fetch all "Libro Diario Vehicular" events for the time range
  - name: Libro Diario Vehicular Events
    id: events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - priority
        - event_type
        - location
        - event_category
        - reported_by
        - serial_number
        - state
        - geometry
        - event_details
      event_types:
        - libro_diario_vehicular  # Libro diario vehicular (daily vehicle log); v2 was removed
      include_details: true
      raise_on_empty: false
      include_updates: false
      include_null_geometry: true
      include_display_values: true
      include_related_events: false

  - title: Process and Filter Vehicle
    type: task-group
    description: "Resolve display values, extract patente, filter to selected vehicle."
    tasks:
      - name: Process Event Details
        id: processed_events
        task: process_events_details
        partial:
          df: ${{ workflow.events.return }}
          client: ${{ workflow.er_client.return }}
          map_to_titles: false
          ordered: true

      - name: Extract Vehicle Plate
        id: extract_patente
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.processed_events.return }}
          column_name: event_details
          field_name_options:
            - vehiculo_no_listado_patente  # typed plate, only set for an unlisted vehicle
            - vehiculo_patente
            - Patente
          output_column_name: patente
          output_type: str
          fan_out: true

      - name: Filter to Selected Vehicle
        id: vehicle_data
        task: filter_df
        partial:
          df: ${{ workflow.extract_patente.return }}
          column_name: patente
          op: equal
          value: ${{ workflow.patente.return }}
          reset_index: false

  - title: Extract Vehicle Fields
    type: task-group
    description: "Extract all fields from event_details on the filtered vehicle rows."
    tasks:
      - name: Extract Departure KM
        id: extract_km_salida
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.vehicle_data.return }}
          column_name: event_details
          field_name_options:
            - KM_de_salida
          output_column_name: km_salida
          output_type: float
          fan_out: true

      - name: Extract Arrival KM
        id: extract_km_llegada
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_km_salida.return }}
          column_name: event_details
          field_name_options:
            - Km_de_llegada
          output_column_name: km_llegada
          output_type: float
          fan_out: true

      - name: Extract Fuel Loaded
        id: extract_litros
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_km_llegada.return }}
          column_name: event_details
          field_name_options:
            - cantidad_de_litros_cargados
            - Litros_cargados
          output_column_name: litros_cargados
          output_type: float
          fan_out: true

      - name: Extract Fuel Type
        id: extract_tipo_combustible
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_litros.return }}
          column_name: event_details
          field_name_options:
            - tipo_de_combustible_cargado
            - Tipo_de_combustible
          output_column_name: tipo_combustible
          output_type: str
          fan_out: true

      - name: Count Passengers
        id: extract_ocupantes
        task: extract_array_length_from_json_column
        partial:
          df: ${{ workflow.extract_tipo_combustible.return }}
          column_name: event_details
          field_name: ocupantes_del_vehiculo
          output_column_name: ocupantes

      - name: Extract Trip Purpose
        id: extract_objetivo
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_ocupantes.return }}
          column_name: event_details
          field_name_options:
            - motivo_del_desplazamiento
            - Motivo_del_desplazamiento
          output_column_name: objetivo
          output_type: str
          fan_out: true

      - name: Format Trip Purpose
        id: format_objetivo
        task: join_list_column
        partial:
          df: ${{ workflow.extract_objetivo.return }}
          column_name: objetivo
          separator: ", "

      - name: Extract Trip Origin
        id: extract_origen
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.format_objetivo.return }}
          column_name: event_details
          field_name_options:
            - origen
            - Origen_del_desplazamiento
          output_column_name: origen
          output_type: str
          fan_out: true

      - name: Extract Destination
        id: extract_destino
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_origen.return }}
          column_name: event_details
          field_name_options:
            - destino
            - Destino
          output_column_name: destino
          output_type: str
          fan_out: true

      - name: Extract Return Time
        id: extract_hora_llegada
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_destino.return }}
          column_name: event_details
          field_name_options:
            - fecha_y_hora_del_regreso
            - Regreso
          output_column_name: regreso
          output_type: str
          fan_out: true

      - name: Extract Driver
        id: extract_chofer
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_hora_llegada.return }}
          column_name: event_details
          field_name_options:
            - Chofer
          output_column_name: chofer
          output_type: str
          fan_out: true

      - name: Extract Refuel Method
        id: extract_forma_recarga
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_chofer.return }}
          column_name: event_details
          field_name_options:
            - Forma_de_recarga
          output_column_name: forma_recarga
          output_type: str
          fan_out: true

      - name: Extract Responsible for Refuel
        id: extract_responsable_recarga
        task: extract_value_from_json_column
        partial:
          df: ${{ workflow.extract_forma_recarga.return }}
          column_name: event_details
          field_name_options:
            - Responsable_de_la_recarga
          output_column_name: responsable_recarga
          output_type: str
          fan_out: true

      - name: Calculate KM Travelled per Journey
        id: km_por_viaje_raw
        task: apply_arithmetic_operation_over_rows
        partial:
          df: ${{ workflow.extract_responsable_recarga.return }}
          column_a: km_llegada
          column_b: km_salida
          output_column: km_viaje
          operation: subtract

      # A return odometer lower than the departure one is a typo; don't let it skew the totals
      - name: Ignore Impossible Trip Distances
        id: km_por_viaje
        task: blank_negative_values
        partial:
          df: ${{ workflow.km_por_viaje_raw.return }}
          column: km_viaje

  - title: Vehicle Statistics Cards
    type: task-group
    description: "Four stat cards summarising the selected vehicle over the chosen period."
    tasks:
      - name: Calculate Total Journeys
        id: total_journeys
        task: dataframe_count
        partial:
          df: ${{ workflow.km_por_viaje.return }}

      - name: Create Total Journeys Widget
        id: total_journeys_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de desplazamientos"
          decimal_places: 0
          data: ${{ workflow.total_journeys.return }}

      - name: Calculate Total KM Travelled
        id: total_km
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: km_viaje

      - name: Create Total KM Widget
        id: total_km_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Kilómetros totales recorridos"
          decimal_places: 0
          data: ${{ workflow.total_km.return }}

      - name: Calculate Total Fuel Consumed
        id: total_fuel
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: litros_cargados

      - name: Total Fuel as Quantity
        id: total_fuel_q
        task: to_quantity
        partial:
          value: ${{ workflow.total_fuel.return }}
          unit: "L"

      - name: Create Total Fuel Widget
        id: total_fuel_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Total de combustible consumido"
          decimal_places: 0
          data: ${{ workflow.total_fuel_q.return }}

      - name: Calculate Average Occupants
        id: avg_occupants
        task: dataframe_column_mean
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column_name: ocupantes

      - name: Create Average Occupants Widget
        id: avg_occupants_sv
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Promedio de ocupantes"
          decimal_places: 1
          data: ${{ workflow.avg_occupants.return }}

  - title: KM Over Time Chart
    type: task-group
    description: "Monthly bar chart of kilometres travelled for the selected vehicle."
    tasks:
      - id: km_over_time_chart
        task: draw_time_series_bar_chart_grouped
        partial:
          dataframe: ${{ workflow.km_por_viaje.return }}
          x_axis: time
          y_axis: km_viaje
          category: patente
          agg_function: sum
          time_interval: month
          color_palette: null
          layout_style:
            title: "Kilómetros recorridos en el tiempo"
            title_x: 0.5
            font_size: null
            font_color: null
            font_style: null
            plot_bgcolor: null
            showlegend: false
            hovermode: "x unified"
            legend_title: null
            xaxis:
              title: "Mes"
              range: null
            yaxis:
              title: "Kilómetros (km)"
              range: null
            bargap: 0.2
            bargroupgap: 0.1

      - name: Persist KM Over Time Chart
        id: km_over_time_chart_html
        task: persist_text
        partial:
          text: ${{ workflow.km_over_time_chart.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: km_over_time_chart

      - name: Create KM Over Time Chart Widget
        id: km_over_time_chart_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Kilómetros recorridos en el tiempo"
          data: ${{ workflow.km_over_time_chart_html.return }}

  - title: Driver Ranking Table
    type: task-group
    description: "Drivers ranked by total km and journey count."
    tasks:
      - name: Summarise by Driver
        id: driver_ranking_data
        task: summarize_df
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          groupby_cols:
            - chofer
          reset_index: true
          summary_params:
            - display_name: "Kilómetros recorridos"
              aggregator: sum
              column: km_viaje
              decimal_places: 0
            - display_name: "Cantidad de desplazamientos"
              aggregator: count
              column: time  # every trip has a time; km is missing when an odometer reading is
              decimal_places: 0

      - name: Rank Drivers by KM
        id: driver_ranking_sorted
        task: sort_values
        partial:
          df: ${{ workflow.driver_ranking_data.return }}
          column_name: "Kilómetros recorridos"
          ascending: false
          na_position: last

      - name: Rename Driver Column
        id: driver_ranking_columns
        task: map_columns
        partial:
          df: ${{ workflow.driver_ranking_sorted.return }}
          raise_if_not_found: false
          retain_columns:
            - chofer
            - "Kilómetros recorridos"
            - "Cantidad de desplazamientos"
          rename_columns:
            chofer: "Nombre"
          drop_columns: null
          duplicate_strategy: suffix

      - name: Draw Driver Ranking Table
        id: driver_ranking_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.driver_ranking_columns.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false

      - name: Persist Driver Ranking Table
        id: driver_ranking_table_html
        task: persist_text
        partial:
          text: ${{ workflow.driver_ranking_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: driver_ranking_table

      - name: Create Driver Ranking Widget
        id: driver_ranking_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Ranking de choferes"
          data: ${{ workflow.driver_ranking_table_html.return }}

  - title: Vehicle Usage Table
    type: task-group
    description: "Full trip log for the selected vehicle."
    tasks:
      - name: Show Trip Dates in Local Time
        id: vehicle_usage_dates
        task: format_datetime_columns
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          columns:
            - time
            - regreso
          timezone: ${{ workflow.get_timezone.return }}

      - name: Select Columns for Vehicle Usage Table
        id: vehicle_usage_columns
        task: map_columns
        partial:
          df: ${{ workflow.vehicle_usage_dates.return }}
          raise_if_not_found: false
          retain_columns:
            - time
            - regreso
            - litros_cargados
            - tipo_combustible
            - objetivo
            - origen
            - destino
            - km_viaje
          rename_columns:
            time: "Fecha de inicio"
            regreso: "Fecha de fin"
            litros_cargados: "Cantidad de combustible (litros)"
            tipo_combustible: "Tipo de combustible"
            objetivo: "Objetivo"
            origen: "Origen"
            destino: "Destino"
            km_viaje: "Distancia recorrida (km)"
          drop_columns: null
          duplicate_strategy: suffix

      - name: Draw Vehicle Usage Table
        id: vehicle_usage_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.vehicle_usage_columns.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false

      - name: Persist Vehicle Usage Table
        id: vehicle_usage_table_html
        task: persist_text
        partial:
          text: ${{ workflow.vehicle_usage_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: vehicle_usage_table

      - name: Create Vehicle Usage Widget
        id: vehicle_usage_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Uso del Vehículo"
          data: ${{ workflow.vehicle_usage_table_html.return }}

  - title: Fuel Refill Table
    type: task-group
    description: "Fuel refill events for the selected vehicle."
    tasks:
      - name: Keep Only Trips With a Refuel
        id: refuel_rows
        task: keep_rows_with_value
        partial:
          df: ${{ workflow.km_por_viaje.return }}
          column: litros_cargados

      - name: Show Refuel Dates in Local Time
        id: refuel_dates
        task: format_datetime_columns
        partial:
          df: ${{ workflow.refuel_rows.return }}
          columns:
            - time
          timezone: ${{ workflow.get_timezone.return }}

      - name: Select Columns for Fuel Refill Table
        id: refuel_columns
        task: map_columns
        partial:
          df: ${{ workflow.refuel_dates.return }}
          raise_if_not_found: false
          retain_columns:
            - time
            - forma_recarga
            - tipo_combustible
            - litros_cargados
            - responsable_recarga
          rename_columns:
            time: "Fecha"
            forma_recarga: "Estación de servicio"
            tipo_combustible: "Tipo de combustible"
            litros_cargados: "Litros cargados"
            responsable_recarga: "Responsable de la carga"
          drop_columns: null
          duplicate_strategy: suffix

      - name: Draw Fuel Refill Table
        id: refuel_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.refuel_columns.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false

      - name: Persist Fuel Refill Table
        id: refuel_table_html
        task: persist_text
        partial:
          text: ${{ workflow.refuel_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: refuel_table

      - name: Create Fuel Refill Widget
        id: refuel_sv
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Recargas de combustible"
          data: ${{ workflow.refuel_table_html.return }}

  - name: Get Report Template Path
    id: get_template_path
    task: set_string_var

  - id: norm_template_path
    task: remove_file_scheme
    partial:
      path: ${{ workflow.get_template_path.return }}

  - id: norm_output_dir
    task: remove_file_scheme
    partial:
      path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - title: Vehicle Report
    type: task-group
    description: "Generates a DOCX report of this vehicle's activity using only the tables and stats already computed above."
    tasks:
      - id: generate_word_doc
        task: generate_vehicle_report
        skipif:
          conditions:
            - never  # one empty widget shouldn't skip the whole report
        partial:
          patente: ${{ workflow.patente.return }}
          time_range: ${{ workflow.time_range.return }}
          total_journeys: ${{ workflow.total_journeys.return }}
          total_km: ${{ workflow.total_km.return }}
          total_fuel: ${{ workflow.total_fuel_q.return }}
          avg_occupants: ${{ workflow.avg_occupants.return }}
          vehicle_usage_table: ${{ workflow.vehicle_usage_columns.return }}
          driver_ranking_table: ${{ workflow.driver_ranking_columns.return }}
          refuel_table: ${{ workflow.refuel_columns.return }}
          user_details: ${{ workflow.user_details.return }}
          template_path: ${{ workflow.norm_template_path.return }}
          output_dir: ${{ workflow.norm_output_dir.return }}
          km_over_time_chart_html: ${{ workflow.km_over_time_chart_html.return }}  # the task screenshots it

  # the Word report, offered for download with the dashboard (as in APN-patrol_event)
  - name: Report files
    id: report_files
    task: create_files_single_view
    partial:
      files:
        - ${{ workflow.generate_word_doc.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.total_journeys_sv.return }}
        - ${{ workflow.total_km_sv.return }}
        - ${{ workflow.total_fuel_sv.return }}
        - ${{ workflow.avg_occupants_sv.return }}
        - ${{ workflow.km_over_time_chart_sv.return }}
        - ${{ workflow.driver_ranking_sv.return }}
        - ${{ workflow.vehicle_usage_sv.return }}
        - ${{ workflow.refuel_sv.return }}
      time_range: ${{ workflow.time_range.return }}
      files: ${{ workflow.report_files.return }}
